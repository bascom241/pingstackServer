spring.application.name=pingstack



spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USER}
spring.datasource.password=${DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.auto-commit=false

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.profiles.active=dev

jwt.secret.key=${JWT_SECRET_KEY}

server.port=${SERVER_PORT:3000}

paystack.secret.key=${PAYSTACK_SECRET_KEY}
paystack.init.url=${PAYSTACK_INIT_URL}
paystack.callback.url=${PAYSTACK_CALLBACK_URL}

cloud-name=${CLOUD_NAME}
cloud-key=${CLOUD_KEY}
cloud-secret=${CLOUD_SECRET}

termii.api.key=${TERMII_API_KEY}
termii.sender.id=${TERMII_SENDER_ID}

brevo.api.key=${BREVO_API_KEY}
brevo.smtp.username=${BREVO_SMTP_USERNAME}
brevo.smtp.password=${BREVO_SMTP_PASSWORD}

brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=${BREVO_SENDER_NAME}

pingstack.webhook.brevo-token=${PINGSTACK_WEBHOOK_BREVO_TOKEN}

client.dev.url=${CLIENT_DEV_URL}
